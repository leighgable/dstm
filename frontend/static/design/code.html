<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DSTM Custom Design</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#000000",
                        "background-light": "#FFFFFF",
                        "background-dark": "#121212",
                        "surface-light": "#F9F9F9",
                        "surface-dark": "#1E1E1E",
                        "border-light": "#E5E5E5",
                        "border-dark": "#333333",
                        "text-secondary-light": "#666666",
                        "text-secondary-dark": "#AAAAAA"
                    },
                    fontFamily: {
                        display: ["Cinzel", "serif"],
                        body: ["Lato", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-primary dark:text-white font-body h-screen flex flex-col antialiased selection:bg-gray-200 dark:selection:bg-gray-700">

<header class="flex-none border-b border-border-light dark:border-border-dark">
    <div class="px-6 py-4 flex justify-between items-center">
        <div></div>
        <div class="text-center">
            <h1 class="font-display text-2xl tracking-[0.15em] font-semibold">DSTM</h1>
            <p class="text-[10px] tracking-[0.2em] text-text-secondary-light dark:text-text-secondary-dark uppercase mt-1">Atelier Concierge</p>
        </div>
        <button class="p-2 -mr-2 rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors relative">
            <span class="material-symbols-outlined text-[24px]">shopping_bag</span>
        </button>
    </div>
</header>

<main id="main-content" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-full max-w-md mx-auto">
        <p class="font-display text-lg tracking-wider mb-4">Inspiration</p>
        <div class="aspect-[3/4] w-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark mb-8 shadow-subtle">
            <img id="inspiration-image" src="" alt="Inspiration garment" class="w-full h-full object-cover">
        </div>

        <div class="relative">
            <textarea id="prompt-input" class="w-full bg-surface-light dark:bg-surface-dark border-border-light dark:border-border-dark focus:border-primary dark:focus:border-white focus:ring-0 p-4 text-sm resize-none placeholder-text-secondary-light dark:placeholder-text-secondary-dark" placeholder="Describe a variation or a new idea..." rows="3"></textarea>
            <button id="send-prompt-button" class="absolute bottom-3 right-3 p-2 text-primary dark:text-white disabled:opacity-50 transition-colors bg-surface-light dark:bg-surface-dark">
                <span class="material-symbols-outlined text-[24px]">arrow_upward</span>
            </button>
        </div>
        <p class="text-xs text-text-secondary-light dark:text-text-secondary-dark mt-4 tracking-wide">
            Describe a modification to the piece above or an entirely new concept in the same style.
        </p>
    </div>
</main>

<footer class="flex-none text-center p-6">
    <p class="text-[10px] tracking-[0.2em] text-text-secondary-light dark:text-text-secondary-dark uppercase">Custom AI-Powered Design</p>
</footer>

<script src="/ai-chat.js"></script>
</body>
</html>
